name: Saucedemo

on:
  push:
    branches: [master]
    paths: ['Saucedemo/**', '.github/workflows/saucedemo.yml', '.github/workflows/cypress-reusable.yml']
  pull_request:
    paths: ['Saucedemo/**', '.github/workflows/saucedemo.yml', '.github/workflows/cypress-reusable.yml']
  schedule:
    - cron: '0 1 * * 1' # every Monday 08:00 WIB – catches changes on the target website
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/cypress-reusable.yml
    with:
      project: Saucedemo
