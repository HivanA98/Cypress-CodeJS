name: GreenHoop

on:
  push:
    branches: [master]
    paths: ['GreenHoop/**', '.github/workflows/greenhoop.yml', '.github/workflows/cypress-reusable.yml']
  pull_request:
    paths: ['GreenHoop/**', '.github/workflows/greenhoop.yml', '.github/workflows/cypress-reusable.yml']
  schedule:
    - cron: '0 1 * * 1' # every Monday 08:00 WIB – catches changes on the target website
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/cypress-reusable.yml
    with:
      project: GreenHoop
    secrets:
      cypress-env: ${{ secrets.GREENHOOP_CYPRESS_ENV }}
