name: Cypress (reusable)

# Workflow ini dipanggil oleh workflow per project (lihat file *.yml lain di folder ini).
on:
  workflow_call:
    inputs:
      project:
        description: Folder project yang dijalankan
        required: true
        type: string
      command:
        description: Perintah test (kosong = npx cypress run)
        required: false
        type: string
        default: ''
      fallback-command:
        description: Perintah test jika secret cypress-env tidak tersedia
        required: false
        type: string
        default: ''
      site-url:
        description: >-
          URL yang dicek dulu sebelum menjalankan Cypress. Jika website menolak runner GitHub
          (mis. HTTP 403 dari WAF untuk IP datacenter), test dilewati dengan warning, bukan error.
        required: false
        type: string
        default: ''
    secrets:
      cypress-env:
        description: Isi cypress.env.json (JSON) untuk project yang butuh akun test
        required: false

jobs:
  e2e:
    name: ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ inputs.project }}/package-lock.json

      - name: Check website is reachable from the runner
        id: site
        if: inputs.site-url != ''
        env:
          SITE_URL: ${{ inputs.site-url }}
          PROJECT: ${{ inputs.project }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 "$SITE_URL" || true)
          echo "HTTP status for $SITE_URL: $status"
          if [ "$status" = "000" ] || [ "$status" -ge 400 ]; then
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Tests skipped – website blocks GitHub runners::$SITE_URL returned HTTP $status to this GitHub-hosted runner. Run the suite locally or on a self-hosted runner."
            {
              echo "### ⚠️ $PROJECT: tests skipped"
              echo ""
              echo "\`$SITE_URL\` returned **HTTP $status** to this GitHub-hosted runner."
              echo "The website blocks datacenter traffic, so the suite cannot run here."
              echo "Run it locally or on a self-hosted runner instead."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.site.outputs.reachable != 'false'
        run: npm ci

      # npm 11 bisa melewati postinstall Cypress, jadi pastikan binary-nya terpasang.
      - name: Install Cypress binary
        if: steps.site.outputs.reachable != 'false'
        run: npx cypress install && npx cypress verify

      - name: Create cypress.env.json from secret
        if: steps.site.outputs.reachable != 'false'
        id: secrets
        env:
          CYPRESS_ENV_JSON: ${{ secrets.cypress-env }}
        run: |
          if [ -n "$CYPRESS_ENV_JSON" ]; then
            echo "$CYPRESS_ENV_JSON" > cypress.env.json
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Cypress
        if: steps.site.outputs.reachable != 'false'
        uses: cypress-io/github-action@v7
        with:
          install: false
          working-directory: ${{ inputs.project }}
          # Tanpa secret → pakai fallback-command (jika ada), selain itu pakai command.
          command: ${{ (steps.secrets.outputs.available != 'true' && inputs.fallback-command != '') && inputs.fallback-command || inputs.command }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ inputs.project }}
          path: |
            ${{ inputs.project }}/cypress/reports
            ${{ inputs.project }}/cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14
